name: Taiwan Market Discovery

on:
  workflow_dispatch:

  schedule:
    # 台灣時間週一～週五 15:10
    # UTC = 07:10
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: taiwan-market-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MIN_TRADE_VALUE: "50000000"
      RESULT_LIMIT: "30"
      HISTORY_CANDIDATE_LIMIT: "40"
      DYNAMIC_PREVIEW_LIMIT: "11"
      DYNAMIC_MAX_PER_INDUSTRY: "2"
      MIN_DYNAMIC_SCORE: "50"
      DYNAMIC_TTL_HOURS: "72"
      BENCHMARK_SYMBOL: "0050"
      PINNED_SYMBOLS: "0050,00713,2303,2308,2330,2357,2408,2454,6757"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run discovery production scan
        run: |
          python scripts/discovery.py

      - name: Show discovery summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          scan = json.loads(
              Path("data/discovery-scan.json").read_text(
                  encoding="utf-8"
              )
          )

          print("Version:", scan.get("version"))
          print("Market date:", scan.get("marketDate"))
          print("Data integrity:", scan.get("dataIntegrityGate"))
          print("Universe:", scan.get("commonStockUniverseCount"))
          print("Eligible:", scan.get("eligibleCount"))
          print("History:", scan.get("historyEnrichedCount"))
          print("History errors:", scan.get("historyErrorCount"))
          print("Dynamic stats:", scan.get("dynamicPreviewStats"))

          dynamic_path = Path("data/watchlist-dynamic.json")

          if dynamic_path.exists():
              dynamic = json.loads(
                  dynamic_path.read_text(
                      encoding="utf-8"
                  )
              )

              print(
                  "Dynamic candidates:",
                  [
                      (
                          x.get("symbol"),
                          x.get("score"),
                          x.get("setup"),
                          x.get("industry"),
                      )
                      for x in dynamic.get(
                          "candidates",
                          [],
                      )
                  ],
              )

              print(
                  "Dynamic expires:",
                  dynamic.get("expiresAt"),
              )
          PY

      - name: Commit discovery and dynamic watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/discovery-scan.json             data/watchlist-dynamic.json

          if git diff --cached --quiet
          then
            echo "No discovery changes."
            exit 0
          fi

          git commit             -m "Update Taiwan discovery and dynamic watchlist"

          git pull             --rebase             origin             "${GITHUB_REF_NAME}"

          git push
