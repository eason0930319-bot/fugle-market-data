name: Taiwan Market Discovery + Screener + Performance

on:
  workflow_dispatch:

  schedule:
    # 台灣時間週一～週五 18:30
    # UTC = 10:30
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: taiwan-market-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MIN_TRADE_VALUE: "50000000"
      RESULT_LIMIT: "30"
      HISTORY_CANDIDATE_LIMIT: "40"
      DYNAMIC_PREVIEW_LIMIT: "11"
      DYNAMIC_MAX_PER_INDUSTRY: "2"
      MIN_DYNAMIC_SCORE: "50"
      DYNAMIC_TTL_HOURS: "72"
      BENCHMARK_SYMBOL: "0050"
      PINNED_SYMBOLS: "0050,00713,2303,2308,2330,2357,2408,2454,6757"

      SCREENER_MIN_TRADE_VALUE: "50000000"
      SCREENER_BUCKET_LIMIT: "30"
      SCREENER_TOP_LIMIT: "50"
      SCREENER_SECTOR_LIMIT: "20"

      PERFORMANCE_TRACK_LIMIT: "50"
      PERFORMANCE_MIN_SAMPLE: "100"
      PERFORMANCE_RETENTION_DAYS: "365"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set screener date-gate mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SCREENER_STRICT_TODAY=0" >> "$GITHUB_ENV"
            echo "Manual run: allow the latest matching TWSE/TPEx session for testing."
          else
            echo "SCREENER_STRICT_TODAY=1" >> "$GITHUB_ENV"
            echo "Scheduled run: require the current Asia/Taipei trading date."
          fi

      - name: Run discovery production scan
        run: |
          python scripts/discovery.py

      - name: Run full-market screener
        run: |
          python scripts/tw_screener.py

      - name: Update performance feedback layer
        run: |
          python scripts/performance_tracker.py

      - name: Show discovery, screener and performance summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          scan_path = Path("data/discovery-scan.json")
          screener_path = Path("data/tw-screener.json")
          performance_path = Path("data/performance-summary.json")

          if scan_path.exists():
              scan = json.loads(scan_path.read_text(encoding="utf-8"))
              print("=== Discovery ===")
              print("Version:", scan.get("version"))
              print("Market date:", scan.get("marketDate"))
              print("Market date gate:", scan.get("marketDateGate"))
              print("Data integrity:", scan.get("dataIntegrityGate"))
              print("Universe:", scan.get("commonStockUniverseCount"))
              print("Eligible:", scan.get("eligibleCount"))
              print("History enriched:", scan.get("historyEnrichedCount"))
              print("History errors:", scan.get("historyErrorCount"))
              print("Dynamic stats:", scan.get("dynamicPreviewStats"))

          if screener_path.exists():
              screener = json.loads(
                  screener_path.read_text(encoding="utf-8")
              )
              print("\n=== Full-market Screener ===")
              print("Version:", screener.get("version"))
              print("Market date:", screener.get("marketDate"))
              print("Gate:", screener.get("marketDateGate"))
              print("Coverage:", screener.get("coverage"))
              print("Breadth:", screener.get("breadth"))

              print(
                  "Top sectors:",
                  [
                      (
                          x.get("industry"),
                          x.get("sectorStrengthScore"),
                          x.get("medianChangePct"),
                          x.get("advanceRatio"),
                      )
                      for x in screener.get("sectorRanking", [])[:10]
                  ],
              )

              print(
                  "Top candidates:",
                  [
                      (
                          x.get("symbol"),
                          x.get("name"),
                          x.get("discoveryScore"),
                          x.get("signals"),
                      )
                      for x in screener.get("topCandidates", [])[:15]
                  ],
              )

              history = screener.get("historyLayer") or {}
              print(
                  "History layer:",
                  {
                      "available": history.get("available"),
                      "version": history.get("version"),
                      "historyEnrichedCount": history.get(
                          "historyEnrichedCount"
                      ),
                      "historyErrorCount": history.get(
                          "historyErrorCount"
                      ),
                  },
              )

          if performance_path.exists():
              performance = json.loads(
                  performance_path.read_text(encoding="utf-8")
              )
              print("\n=== Performance Feedback ===")
              print("Version:", performance.get("version"))
              print("Market date:", performance.get("marketDate"))
              print("Records:", performance.get("recordCount"))
              print("Overall:", performance.get("overall"))
              print(
                  "Calibration:",
                  performance.get("calibrationReadiness"),
              )
              print(
                  "Observations:",
                  performance.get("observations"),
              )
              print(
                  "Last run:",
                  performance.get("lastRun"),
              )
          PY

      - name: Commit discovery, screener and performance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/discovery-scan.json \
            data/watchlist-dynamic.json \
            data/tw-screener.json \
            data/performance-ledger.json \
            data/performance-summary.json

          if git diff --cached --quiet
          then
            echo "No market-data changes."
            exit 0
          fi

          git commit -m "Update Taiwan discovery, screener and performance"

          git pull \
            --rebase \
            origin \
            "${GITHUB_REF_NAME}"

          git push
