name: Historical Taiwan OOS V1.8 Frozen 2022-2023

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-oos-v18.yml"
      - "scripts/backtest_snapshot.py"
      - "scripts/backtest_ma5.py"
      - "scripts/backtest_ma5_stop.py"
      - "scripts/backtest_ma5_robustness.py"
      - "scripts/backtest_execution_v17.py"
      - "scripts/backtest_exit_v17b.py"
      - "scripts/backtest_allocation_v17c.py"
      - "scripts/backtest_oos_v18.py"
      - "scripts/backtest_v18_runner.py"
      - "scripts/backtest_v18_repro.py"

permissions:
  contents: write

concurrency:
  group: historical-taiwan-oos-v18
  cancel-in-progress: true

jobs:
  oos-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BACKTEST_DOWNLOAD_BATCH: "80"
      BACKTEST_FREEZE_ID: "tw-history-2022-20260828-v1"
      BACKTEST_FREEZE_TAG: "backtest-data-tw-history-2022-20260828-v1"
      BACKTEST_FROZEN_DATA: ".backtest-freeze/tw-history-2022-20260828-v1.csv.gz"
      BACKTEST_FROZEN_MANIFEST: ".backtest-freeze/tw-history-2022-20260828-v1.manifest.json"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.34.2 pandas==3.0.5 numpy==2.5.2 scipy==1.18.1 yfinance==1.7.0

      - name: Syntax check
        run: |
          python -m py_compile scripts/backtest_snapshot.py
          python -m py_compile scripts/backtest_ma5.py
          python -m py_compile scripts/backtest_ma5_stop.py
          python -m py_compile scripts/backtest_ma5_robustness.py
          python -m py_compile scripts/backtest_execution_v17.py
          python -m py_compile scripts/backtest_exit_v17b.py
          python -m py_compile scripts/backtest_allocation_v17c.py
          python -m py_compile scripts/backtest_oos_v18.py
          python -m py_compile scripts/backtest_v18_runner.py
          python -m py_compile scripts/backtest_v18_repro.py

      - name: Restore or create immutable 2022-2026 market-data freeze
        run: |
          set -euo pipefail
          mkdir -p .backtest-freeze data
          DATA_NAME="$(basename "$BACKTEST_FROZEN_DATA")"
          MANIFEST_NAME="$(basename "$BACKTEST_FROZEN_MANIFEST")"

          if gh release view "$BACKTEST_FREEZE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Restoring immutable freeze: $BACKTEST_FREEZE_TAG"
            gh release download "$BACKTEST_FREEZE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$DATA_NAME" --pattern "$MANIFEST_NAME" \
              --dir .backtest-freeze --clobber
          else
            echo "Creating immutable freeze: $BACKTEST_FREEZE_TAG"
            python scripts/backtest_snapshot.py create \
              --start "2022-01-01" \
              --end "2026-08-28" \
              --data "$BACKTEST_FROZEN_DATA" \
              --manifest "$BACKTEST_FROZEN_MANIFEST" \
              --freeze-id "$BACKTEST_FREEZE_ID" \
              --batch-size "$BACKTEST_DOWNLOAD_BATCH"
            gh release create "$BACKTEST_FREEZE_TAG" \
              "$BACKTEST_FROZEN_DATA" "$BACKTEST_FROZEN_MANIFEST" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Taiwan immutable backtest data freeze 2022-01-01 to 2026-08-28" \
              --notes "Immutable public-market OHLCV snapshot for repeated V1.8+ robustness and walk-forward research. Never overwrite this freeze; create a new freezeId for future extensions."
          fi

          python scripts/backtest_snapshot.py verify \
            --data "$BACKTEST_FROZEN_DATA" \
            --manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Run fixed V1.7C winner on 2022-2023 OOS pass 1
        run: |
          python scripts/backtest_v18_runner.py

      - name: Capture pass 1 fingerprint
        run: |
          python scripts/backtest_v18_repro.py capture \
            --output .backtest-freeze/v18-pass1-fingerprint.json \
            --freeze-manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Run fixed V1.7C winner on 2022-2023 OOS pass 2
        run: |
          python scripts/backtest_v18_runner.py

      - name: Verify deterministic V1.8 output
        run: |
          python scripts/backtest_v18_repro.py compare \
            --baseline .backtest-freeze/v18-pass1-fingerprint.json \
            --report data/backtest-oos-v18-reproducibility.json \
            --freeze-manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Show V1.8 OOS summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('data/backtest-oos-v18-summary.json').read_text(encoding='utf-8'))
          r = json.loads(Path('data/backtest-oos-v18-reproducibility.json').read_text(encoding='utf-8'))
          print('Freeze:', s['dataFreeze']['freezeId'], s['dataFreeze']['dataFileSha256'])
          print('Frozen period:', s['dataFreeze']['targetStart'], 'to', s['dataFreeze']['targetEnd'])
          print('Deterministic:', r.get('deterministicAcrossTwoConsecutiveRuns'))
          print('Mismatches:', r.get('mismatchedOutputs'))
          print('Fixed strategy:', s.get('fixedStrategy'))
          for year, row in s.get('yearly', {}).items():
              print(year, {
                  'totalReturnPct': row.get('totalReturnPct'),
                  'maxDrawdownPct': row.get('maxDrawdownPct'),
                  'profitFactor': row.get('profitFactor'),
                  'expectancyPct': row.get('expectancyPct'),
                  'winRate': row.get('winRate'),
                  'tradeCount': row.get('tradeCount'),
                  '0050PriceReturnPct': row.get('benchmark0050PriceReturnPct'),
                  'basicPass': row.get('basicPass'),
              })
          print('Combined 2022-2023:', s.get('combined2022To2023'))
          print('All OOS years pass:', s.get('allOosYearsBasicPass'))
          PY

      - name: Commit V1.8 frozen OOS outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/backtest-oos-v18-summary.json \
            data/backtest-oos-v18-reproducibility.json \
            data/backtest-oos-v18-freeze-manifest.json
          if git diff --cached --quiet; then
            echo "No V1.8 OOS output changes."
            exit 0
          fi
          git commit -m "Update frozen Taiwan OOS robustness backtest V1.8"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
