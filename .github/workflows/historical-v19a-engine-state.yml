name: Historical Taiwan V1.9A Engine State Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-v19a-engine-state.yml"
      - "research/v19a-preregister.json"
      - "scripts/backtest_engine_state_v19a.py"
      - "scripts/backtest_v19a_runner.py"
      - "scripts/backtest_v19a_repro.py"

permissions:
  contents: write

concurrency:
  group: historical-taiwan-v19a-engine-state
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BACKTEST_FREEZE_ID: "tw-history-2022-20260828-v1"
      BACKTEST_FREEZE_TAG: "backtest-data-tw-history-2022-20260828-v1"
      BACKTEST_FROZEN_DATA: ".backtest-freeze/tw-history-2022-20260828-v1.csv.gz"
      BACKTEST_FROZEN_MANIFEST: ".backtest-freeze/tw-history-2022-20260828-v1.manifest.json"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.34.2 pandas==3.0.5 numpy==2.5.2 scipy==1.18.1 yfinance==1.7.0

      - name: Syntax check
        run: |
          python -m py_compile scripts/backtest_data.py
          python -m py_compile scripts/backtest_snapshot.py
          python -m py_compile scripts/backtest_ma5.py
          python -m py_compile scripts/backtest_ma5_stop.py
          python -m py_compile scripts/backtest_ma5_robustness.py
          python -m py_compile scripts/backtest_execution_v17.py
          python -m py_compile scripts/backtest_exit_v17b.py
          python -m py_compile scripts/backtest_allocation_v17c.py
          python -m py_compile scripts/backtest_engine_state_v19a.py
          python -m py_compile scripts/backtest_v19a_runner.py
          python -m py_compile scripts/backtest_v19a_repro.py
          python -m json.tool research/v19a-preregister.json >/dev/null

      - name: Restore immutable frozen data
        run: |
          set -euo pipefail
          mkdir -p .backtest-freeze data
          DATA_NAME="$(basename "$BACKTEST_FROZEN_DATA")"
          MANIFEST_NAME="$(basename "$BACKTEST_FROZEN_MANIFEST")"
          gh release download "$BACKTEST_FREEZE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$DATA_NAME" --pattern "$MANIFEST_NAME" \
            --dir .backtest-freeze --clobber
          python scripts/backtest_snapshot.py verify \
            --data "$BACKTEST_FROZEN_DATA" \
            --manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Run V1.9A pass 1
        run: python scripts/backtest_v19a_runner.py

      - name: Capture pass 1 fingerprint
        run: |
          python scripts/backtest_v19a_repro.py capture \
            --output .backtest-freeze/v19a-pass1.json \
            --freeze-manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Run V1.9A pass 2
        run: python scripts/backtest_v19a_runner.py

      - name: Verify deterministic V1.9A output
        run: |
          python scripts/backtest_v19a_repro.py compare \
            --baseline .backtest-freeze/v19a-pass1.json \
            --report data/backtest-engine-state-v19a-reproducibility.json \
            --freeze-manifest "$BACKTEST_FROZEN_MANIFEST"

      - name: Show V1.9A summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('data/backtest-engine-state-v19a-summary.json').read_text(encoding='utf-8'))
          r = json.loads(Path('data/backtest-engine-state-v19a-reproducibility.json').read_text(encoding='utf-8'))
          print('Freeze:', s['dataFreeze']['freezeId'], s['dataFreeze']['dataFileSha256'])
          print('Deterministic:', r.get('deterministicAcrossTwoConsecutiveRuns'))
          print('Latest state:', s.get('latestFrozenMarketState'))
          print('Trade performance by state:')
          for state, row in s.get('tradePerformanceBySignalState', {}).items():
              print(state, row)
          print('Engine chronology audit:')
          for year, row in s.get('engineAudit', {}).get('yearly', {}).items():
              print(year, {
                  'legacy': row['legacyV17C'].get('totalReturnPct'),
                  'cleanRecycle': row['cleanPriorCloseRecycle'].get('totalReturnPct'),
                  'cleanNoRecycle': row['cleanPriorCloseNoRecycle'].get('totalReturnPct'),
                  'impact': row.get('impactVsLegacy'),
              })
          PY

      - name: Commit V1.9A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$BACKTEST_FROZEN_MANIFEST" data/backtest-engine-state-v19a-freeze-manifest.json
          git add \
            data/backtest-engine-state-v19a-summary.json \
            data/backtest-engine-state-v19a-reproducibility.json \
            data/backtest-engine-state-v19a-freeze-manifest.json
          if git diff --cached --quiet; then
            echo "No V1.9A output changes."
            exit 0
          fi
          git commit -m "Update preregistered Taiwan engine and state audit V1.9A"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
