name: Taiwan Market Discovery

on:
  workflow_dispatch:

  schedule:
    # 台灣時間週一～週五 15:45
    # UTC = 07:45
    - cron: "45 7 * * 1-5"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest

    env:
      MIN_TRADE_VALUE: "50000000"
      RESULT_LIMIT: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run discovery scan
        run: |
          python scripts/discovery.py

      - name: Show discovery summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/discovery-scan.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Universe:",
              data.get(
                  "universeCount"
              )
          )

          print(
              "Eligible:",
              data.get(
                  "eligibleCount"
              )
          )

          print(
              "TWSE:",
              data.get(
                  "sources",
                  {}
              ).get(
                  "TSE"
              )
          )

          print(
              "TPEx:",
              data.get(
                  "sources",
                  {}
              ).get(
                  "OTC"
              )
          )

          print(
              "Top:",
              [
                  x.get(
                      "symbol"
                  )
                  for x
                  in data.get(
                      "topDiscovery",
                      []
                  )[:10]
              ]
          )
          PY

      - name: Commit discovery snapshot
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/discovery-scan.json

          if git diff \
            --cached \
            --quiet
          then
            echo "No discovery changes."
          else
            git commit \
              -m "Update Taiwan market discovery scan"

            git push
          fi
